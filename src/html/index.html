<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <title>Fish Monsters Game</title>
</head>
<body>
    <div class="container">
        <canvas id="main-canvas"></canvas>
    </div>
    <img id="playerImg" src="../images/player.png" alt="">

    <!-- Enemies -->
     <img id="angler1_EnemyImg" src="../images/enemies/angler1.png" alt="">
     <img id="angler2_EnemyImg" src="../images/enemies/angler2.png" alt="">
     <img id="drone_EnemyImg" src="../images/enemies/drone.png" alt="">
     <img id="hivewhale_EnemyImg" src="../images/enemies/hivewhale.png" alt="">
     <img id="lucky_EnemyImg" src="../images/enemies/lucky.png" alt="">

     <!-- Audio -->
      <audio id="explosionAudio" src="../Audio/explosion.wav"></audio>
      <audio id="powerdownAudio" src="../Audio/powerdown.wav"></audio>
      <audio id="powerupAudio" src="../Audio/powerup.wav"></audio>
      <audio id="shieldAudio" src="../Audio/shield.wav"></audio>
      <audio id="shotAudio" src="../Audio/shot.wav"></audio>

     <button class="btn--position btn btn--primary hidden">Start Game</button>

    <script type="module" src="../scripts/app.js"></script>
</body>
</html>
